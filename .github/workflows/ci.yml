name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Wire-format self test
        run: swift run SennheiserControl --selftest
      - name: Package the app
        run: bash scripts/make-app.sh
